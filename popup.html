<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UT Pustaka Downloader Pro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --emerald: #10b981;
        --emerald-hover: #059669;
        --bg-color: #090d16;
        --card-bg: #0f1523;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #1e293b;
        --focus-ring: #38bdf8;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        width: 360px;
        color: var(--text-main);
        background-color: var(--bg-color);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border-color);
      }

      .header img {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        object-fit: cover;
      }

      .header-text h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
      }

      .header-text p {
        margin: 0;
        font-size: 11px;
        color: var(--text-muted);
      }

      .container {
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-row {
        display: flex;
        gap: 10px;
      }

      .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: #050811;
        color: var(--text-main);
        font-size: 13px;
        font-family: inherit;
        font-weight: 600;
      }

      input:focus {
        outline: none;
        border-color: #38bdf8;
      }

      .badge-info {
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.2);
        color: #7dd3fc;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .btn-all {
        padding: 11px;
        width: 100%;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        color: white;
        background: linear-gradient(135deg, #059669, #10b981);
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
      }

      .btn-all:hover {
        background: linear-gradient(135deg, #047857, #059669);
      }

      .btn-single {
        padding: 9px;
        width: 100%;
        border: 1px solid #334155;
        border-radius: 8px;
        font-weight: 600;
        font-size: 12px;
        color: #f8fafc;
        background: #1e293b;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-single:hover {
        background: #334155;
      }

      .footer {
        text-align: center;
        font-size: 11px;
        color: #64748b;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="logo.png"
        alt="Logo"
        onerror="this.src='icon128.png'"
      />
      <div class="header-text">
        <h3>UT Downloader Pro v2.1</h3>
        <p>Full Auto-Batch & Clean Background Engine</p>
      </div>
    </div>

    <div class="container">
      <div class="form-row">
        <div class="form-group">
          <label>Mata Kuliah (Subfolder)</label>
          <input id="sub" type="text" placeholder="EMBS4321" value="EMBS4321" />
        </div>
        <div class="form-group" style="max-width: 110px;">
          <label>Modul (Doc ID)</label>
          <input id="doc" type="text" placeholder="M1" value="M1" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Kecepatan Delay (ms)</label>
          <input id="delay" type="number" value="300" min="100" step="50" />
        </div>
      </div>

      <div class="badge-info">
        ✨ <strong>Auto-Clean:</strong> Watermark & bar hitam UT otomatis dihapus bersih.<br>
        🌐 <strong>Background Tab:</strong> Bebas buka tab lain saat unduh berlangsung!
      </div>

      <button id="btn-download-all" class="btn-all">
        📚 UNDUH SEMUA MODUL (FULL 1 PDF)
      </button>

      <button id="btn-download-single" class="btn-single">
        ⚡ Unduh Modul Saat Ini Saja
      </button>

      <div class="footer">
        Proses unduh akan berjalan di tab UT yang sedang aktif. Pantau lewat badge pil di atas halaman!
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
